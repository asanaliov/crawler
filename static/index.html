<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef0ee;
    --ink: #1a2128;
    --muted: #6b7480;
    --rule: #cfd4d2;
    --link: #1f4fd8;
    --field: #ffffff;
    --leader: #b9c0be;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171b1e;
      --ink: #e7e9e6;
      --muted: #8b939c;
      --rule: #2e353a;
      --link: #7ea0ff;
      --field: #1f2529;
      --leader: #3a4247;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171b1e;
    --ink: #e7e9e6;
    --muted: #8b939c;
    --rule: #2e353a;
    --link: #7ea0ff;
    --field: #1f2529;
    --leader: #3a4247;
  }

  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
    font-weight: 400;
    line-height: 1.5;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 4.5rem 16px 6rem;
  }

  h1 {
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    font-weight: 600;
    font-variation-settings: "opsz" 96;
    letter-spacing: -0.035em;
    line-height: 0.95;
    margin: 0 0 1rem;
  }
  .lede {
    max-width: 30rem;
    margin: 0 0 2.75rem;
    color: var(--muted);
    font-size: 1.05rem;
  }

  form {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 0.5rem;
    align-items: end;
  }
  label {
    display: grid;
    gap: 0.3rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input {
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 0.6rem 0.75rem;
    min-width: 0;
  }
  input[type="number"] { width: 5.25rem; }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--paper);
    background: var(--ink);
    border: 0;
    border-radius: 4px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
    height: 2.75rem;
  }
  button:disabled { cursor: default; opacity: 0.55; }
  @media (max-width: 560px) {
    form { grid-template-columns: 1fr 1fr; }
    form label:first-child { grid-column: 1 / -1; }
    form button { grid-column: 1 / -1; }
  }

  .status {
    margin: 2rem 0 0;
    min-height: 1.5rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .status.error { color: var(--ink); }

  ol {
    list-style: none;
    margin: 1.5rem 0 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }
  li {
    position: relative;
    padding: 1.1rem 0 1.1rem calc(var(--d) * 1.75rem);
    border-bottom: 1px solid var(--rule);
  }
  li[style*="--d: 0"] { padding-left: 0; }
  li:not([style*="--d: 0"])::before {
    content: "";
    position: absolute;
    top: 1.75rem;
    left: calc(var(--d) * 1.75rem - 1.2rem);
    width: 0.8rem;
    height: 1px;
    background: var(--leader);
  }
  @media (prefers-reduced-motion: no-preference) {
    li { animation: arrive 260ms ease-out; }
    @keyframes arrive { from { opacity: 0; } }
  }
  .title {
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .url {
    display: inline-block;
    margin-top: 0.15rem;
    color: var(--link);
    font-size: 0.9rem;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .url:hover { text-decoration: underline; }
  .summary {
    margin: 0.6rem 0 0;
    max-width: 38rem;
  }
  .summary.none { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Read a whole site<br>in a minute.</h1>
  <p class="lede">Give it a starting page. It follows the links, one level at a time, and a local model writes a short summary of each page as it goes.</p>

  <form id="form">
    <label>Start page
      <input type="text" name="url" placeholder="example.com" required autocomplete="off" spellcheck="false">
    </label>
    <label>Pages
      <input type="number" name="max_pages" value="10" min="1" max="50">
    </label>
    <label>Depth
      <input type="number" name="max_depth" value="2" min="0" max="5">
    </label>
    <button type="submit" id="go">Crawl</button>
  </form>

  <p class="status" id="status"></p>
  <ol id="results"></ol>
</main>

<script>
  const form = document.getElementById("form");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const go = document.getElementById("go");
  let source = null;

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (source) source.close();
    results.innerHTML = "";
    status.className = "status";
    go.disabled = true;

    const params = new URLSearchParams(new FormData(form));
    const started = Date.now();
    let count = 0;

    source = new EventSource("/crawl?" + params);

    source.addEventListener("fetching", (ev) => {
      const { url } = JSON.parse(ev.data);
      status.textContent = `Reading ${url}`;
    });

    source.addEventListener("page", (ev) => {
      const p = JSON.parse(ev.data);
      count++;
      const li = document.createElement("li");
      li.style.setProperty("--d", p.depth);
      li.innerHTML = `
        <p class="title"></p>
        <a class="url" target="_blank" rel="noopener"></a>
        <p class="summary"></p>`;
      li.querySelector(".title").textContent = p.title;
      const a = li.querySelector(".url");
      a.href = p.url;
      a.textContent = p.url;
      const s = li.querySelector(".summary");
      if (p.summary) {
        s.textContent = p.summary;
      } else {
        s.textContent = "No summary. Start Ollama to get one.";
        s.classList.add("none");
      }
      results.appendChild(li);
    });

    source.addEventListener("done", (ev) => {
      const secs = Math.round((Date.now() - started) / 1000);
      const url = params.get("url");
      status.textContent = count
        ? `${count} page${count === 1 ? "" : "s"} in ${secs}s.`
        : `Couldn't load ${url}. Check the address and try again.`;
      if (!count) status.classList.add("error");
      finish();
    });

    source.addEventListener("error", (ev) => {
      status.textContent = ev.data
        ? JSON.parse(ev.data).message
        : "Lost the connection to the server. Is app.py still running?";
      status.classList.add("error");
      finish();
    });

    function finish() {
      source.close();
      source = null;
      go.disabled = false;
    }
  });
</script>
</body>
</html>
